      <rect y="328" width="1160" height="82" fill="#f7f5ef" stroke="#d2cfc5"/><rect y="410" width="1160" height="82" fill="#f7f5ef" stroke="#d2cfc5"/><rect y="492" width="1160" height="82" fill="#f7f5ef" stroke="#d2cfc5"/>

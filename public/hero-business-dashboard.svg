<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 1600 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfb"/>
      <stop offset="1" stop-color="#f7f5ef"/>
    </linearGradient>
    <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2457ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2457ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#11110f" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1600" height="1024" fill="url(#paper)"/>

  <!-- Context strip -->
  <rect width="1600" height="55" fill="#11110f"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">
    <text x="37" y="35" fill="#f0eee5">Thoughtstead</text>
    <rect x="214" y="10" width="118" height="35" fill="#f0eee5"/>
    <text x="240" y="33" fill="#11110f">Business</text>
    <text x="362" y="34" fill="#b8b5ac" font-weight="400">Personal</text>
    <text x="455" y="34" fill="#b8b5ac" font-weight="400">Household</text>
  </g>
  <circle cx="1532" cy="27" r="13" fill="#2457ff"/>
  <circle cx="1568" cy="27" r="13" fill="#dfff4f"/>

  <!-- Navigation rail -->
  <rect y="55" width="222" height="969" fill="#f0eee5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#716f68">
    <rect x="18" y="84" width="186" height="45" fill="#dde5ff"/>
    <rect x="18" y="84" width="4" height="45" fill="#2457ff"/>
    <circle cx="48" cy="106" r="6" fill="#2457ff"/>
    <text x="70" y="112" fill="#11110f" font-weight="600">Overview</text>
    <circle cx="48" cy="164" r="6" fill="#a9a59a"/>
    <text x="70" y="170">Capture</text>
    <circle cx="48" cy="219" r="6" fill="#a9a59a"/>
    <text x="70" y="225">Work</text>
    <circle cx="48" cy="274" r="6" fill="#a9a59a"/>
    <text x="70" y="280">Decisions</text>
    <circle cx="48" cy="329" r="6" fill="#a9a59a"/>
    <text x="70" y="335">People</text>
    <circle cx="48" cy="384" r="6" fill="#a9a59a"/>
    <text x="70" y="390">Money</text>
    <circle cx="48" cy="439" r="6" fill="#a9a59a"/>
    <text x="70" y="445">Documents</text>
    <text x="34" y="526" font-size="12" font-weight="700" letter-spacing="1.7">SYSTEM</text>
    <circle cx="48" cy="569" r="6" fill="#a9a59a"/>
    <text x="70" y="575">Agents</text>
    <circle cx="48" cy="624" r="6" fill="#a9a59a"/>
    <text x="70" y="630">Approvals</text>
    <circle cx="48" cy="679" r="6" fill="#a9a59a"/>
    <text x="70" y="685">Audit trail</text>
  </g>

  <!-- Page title -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="271" y="111" fill="#716f68" font-size="15">Thursday, September 4</text>
    <text x="271" y="164" fill="#11110f" font-size="43" font-weight="600" letter-spacing="-1.5">Good morning.</text>
    <text x="271" y="202" fill="#716f68" font-size="18">You have one decision waiting. Everything else is moving.</text>
    <rect x="1375" y="124" width="172" height="50" rx="25" fill="#2457ff"/>
    <text x="1407" y="156" fill="#fcfcfb" font-size="16" font-weight="600">Capture a thought</text>
  </g>

  <!-- Stat band -->
  <g filter="url(#soft-shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="271" y="244" width="298" height="145" fill="#fcfcfb" stroke="#d2cfc5"/>
    <text x="299" y="280" fill="#716f68" font-size="15">Money in</text>
    <text x="299" y="332" fill="#11110f" font-size="38" font-weight="600">$48,240</text>
    <circle cx="305" cy="360" r="5" fill="#20c997"/>
    <text x="319" y="366" fill="#716f68" font-size="14">nothing overdue</text>

    <rect x="589" y="244" width="298" height="145" fill="#fcfcfb" stroke="#d2cfc5"/>
    <text x="617" y="280" fill="#716f68" font-size="15">Decisions</text>
    <text x="617" y="332" fill="#11110f" font-size="38" font-weight="600">1</text>
    <circle cx="623" cy="360" r="5" fill="#ffb000"/>
    <text x="637" y="366" fill="#716f68" font-size="14">awaiting you</text>

    <rect x="907" y="244" width="298" height="145" fill="#fcfcfb" stroke="#d2cfc5"/>
    <text x="935" y="280" fill="#716f68" font-size="15">Agent actions</text>
    <text x="935" y="332" fill="#2457ff" font-size="38" font-weight="600">27</text>
    <text x="935" y="366" fill="#716f68" font-size="14">in the last 7 days</text>

    <rect x="1225" y="244" width="298" height="145" fill="#fcfcfb" stroke="#d2cfc5"/>
    <text x="1253" y="280" fill="#716f68" font-size="15">Notice due</text>
    <text x="1253" y="332" fill="#11110f" font-size="38" font-weight="600">0</text>
    <circle cx="1259" cy="360" r="5" fill="#20c997"/>
    <text x="1273" y="366" fill="#716f68" font-size="14">nothing lapsing</text>
  </g>

  <!-- Main working area -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="271" y="454" fill="#11110f" font-size="17" font-weight="700">Needs you</text>
    <rect x="358" y="435" width="29" height="27" fill="#eef2ff"/>
    <text x="368" y="454" fill="#1747e6" font-size="14" font-weight="700">1</text>

    <rect x="271" y="483" width="776" height="199" fill="#fcfcfb" stroke="#a9a59a" filter="url(#soft-shadow)"/>
    <rect x="271" y="483" width="7" height="199" fill="#2457ff"/>
    <text x="307" y="521" fill="#716f68" font-size="12" font-weight="700" letter-spacing="1.5">PROPOSAL · POSITIONING AGENT</text>
    <text x="307" y="568" fill="#11110f" font-size="27" font-weight="600">Approve the revised launch story?</text>
    <text x="307" y="605" fill="#716f68" font-size="16">Grounded in 14 interviews and the current product brief.</text>
    <rect x="819" y="623" width="91" height="38" rx="19" fill="#2457ff"/>
    <text x="842" y="648" fill="#fcfcfb" font-size="14" font-weight="700">Review</text>
    <text x="938" y="648" fill="#716f68" font-size="14">Parked 12m ago</text>

    <text x="1093" y="454" fill="#11110f" font-size="17" font-weight="700">On the radar</text>
    <line x1="1093" y1="519" x2="1523" y2="519" stroke="#d2cfc5"/>
    <text x="1093" y="496" fill="#716f68" font-size="12" font-weight="700" letter-spacing="1.4">MARKET</text>
    <text x="1093" y="554" fill="#11110f" font-size="17">New model pricing changes</text>
    <text x="1093" y="581" fill="#716f68" font-size="14">Why this matters · your margin assumption changed.</text>
    <line x1="1093" y1="613" x2="1523" y2="613" stroke="#d2cfc5"/>
    <text x="1093" y="649" fill="#11110f" font-size="17">Two customers repeated the same need</text>
    <text x="1093" y="676" fill="#716f68" font-size="14">Linked to the launch decision.</text>
  </g>

  <!-- Activity chart -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="271" y="758" fill="#11110f" font-size="17" font-weight="700">Work moving this week</text>
    <text x="271" y="787" fill="#716f68" font-size="14">Decisions, captures, and actions stay attached.</text>
    <line x1="271" y1="930" x2="1523" y2="930" stroke="#d2cfc5"/>
    <line x1="271" y1="868" x2="1523" y2="868" stroke="#e5e2d8"/>
    <path d="M271 922 C355 914 391 881 458 895 S568 839 635 848 S742 810 815 833 S925 785 1004 801 S1117 770 1197 791 S1358 724 1523 748 L1523 930 L271 930 Z" fill="url(#chart-fill)"/>
    <path d="M271 922 C355 914 391 881 458 895 S568 839 635 848 S742 810 815 833 S925 785 1004 801 S1117 770 1197 791 S1358 724 1523 748" fill="none" stroke="#2457ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1197" cy="791" r="8" fill="#dfff4f" stroke="#11110f" stroke-width="3"/>
    <circle cx="1523" cy="748" r="8" fill="#f04c23" stroke="#11110f" stroke-width="3"/>
  </g>
</svg>
